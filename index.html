<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erika &amp; Elisabetta ♡ 4 Settembre 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #d4a843;
  --gold-light: #f0d98a;
  --gold-dim: rgba(212,168,67,0.45);
  --purple-dark: #2a1038;
  --purple-bg: #1a0826;
  --card-bg: rgba(26,8,40,0.52);
  --text: rgba(255,248,242,0.95);
  --text-soft: rgba(255,248,242,0.72);
}
html, body {
  width: 100%; margin: 0; padding: 0;
  background: var(--purple-bg);
  overflow-x: hidden;
}

/* ── SFONDO ── */
#page {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  height: calc(min(100vw, 520px) * 3.203);
}
#bgImg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: fill;
  display: block;
}

/* ── CONTENUTO SOVRAPPOSTO ── */
#content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 4% 5% 3%;
}
.section {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── NOMI ── */
.names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(2.8rem, 12vw, 5rem);
  color: var(--purple-dark);
  line-height: 1.1;
  text-align: center;
  text-shadow:
    0 0 30px rgba(255,255,255,1),
    0 0 15px rgba(255,255,255,0.9),
    0 2px 6px rgba(255,255,255,0.7);
}
.amp {
  display: block;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(1.6rem, 6.5vw, 2.8rem);
  color: var(--purple-dark);
  opacity: 0.65;
  text-shadow: 0 0 20px rgba(255,255,255,0.9);
  margin: -4px 0;
  text-align: center;
}

/* ── CARD BASE ── */
.card {
  background: var(--card-bg);
  border: 1px solid rgba(212,168,67,0.35);
  border-radius: 10px;
  padding: 4% 5%;
  width: 100%;
  text-align: center;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.label {
  display: block;
  font-family: 'Lato', sans-serif;
  font-size: clamp(0.48rem, 1.8vw, 0.6rem);
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
}
.card p {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(0.9rem, 3.5vw, 1.08rem);
  line-height: 1.85;
  color: var(--text);
}
.card p strong {
  font-weight: 400; font-style: normal;
  color: var(--gold-light);
}
.card p .small {
  font-style: normal; font-weight: 300;
  color: var(--text-soft);
  font-size: clamp(0.78rem, 3vw, 0.92rem);
}

/* ── PROGRAMMA ── */
.timeline {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.tl-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  position: relative;
}
.tl-left {
  width: 22%;
  text-align: right;
  padding-right: 14px;
  padding-top: 2px;
  flex-shrink: 0;
}
.tl-time {
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  font-size: clamp(0.75rem, 3vw, 0.9rem);
  color: var(--gold);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.tl-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  padding-top: 4px;
}
.tl-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--gold-light);
  flex-shrink: 0;
  box-shadow: 0 0 8px rgba(212,168,67,0.7);
}
.tl-line {
  width: 1px;
  flex: 1;
  min-height: 18px;
  background: linear-gradient(to bottom, var(--gold-dim), transparent);
  margin-top: 2px;
}
.tl-row:last-child .tl-line { display: none; }
.tl-right {
  flex: 1;
  padding-left: 14px;
  padding-bottom: 16px;
  padding-top: 0px;
}
.tl-event {
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  font-style: normal;
  font-size: clamp(0.82rem, 3.2vw, 0.98rem);
  color: var(--text);
  line-height: 1.4;
}
.tl-desc {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(0.7rem, 2.6vw, 0.82rem);
  color: var(--text-soft);
  margin-top: 1px;
}

/* ── MAPPA SVG ── */
.map-wrap {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(212,168,67,0.35);
}
.map-wrap svg {
  display: block;
  width: 100%;
  height: auto;
}
.map-btn {
  display: block;
  width: 100%;
  font-family: 'Lato', sans-serif;
  font-size: clamp(0.65rem, 2.5vw, 0.76rem);
  font-weight: 400;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  text-align: center;
  text-decoration: none;
  padding: 12px 16px;
  background: rgba(212,168,67,0.15);
  border-top: 1px solid rgba(212,168,67,0.3);
  color: var(--gold-light);
  transition: background 0.22s;
}
.map-btn:hover, .map-btn:active {
  background: rgba(212,168,67,0.82);
  color: var(--purple-dark);
}

/* ── BOTTONI ── */
.buttons { display: flex; flex-direction: column; width: 100%; gap: 10px; }
.btn {
  display: block; width: 100%;
  font-family: 'Lato', sans-serif;
  font-size: clamp(0.65rem, 2.5vw, 0.76rem);
  font-weight: 400;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  text-align: center;
  text-decoration: none;
  padding: 3.5% 4%;
  border-radius: 4px;
  border: 1px solid rgba(212,168,67,0.48);
  color: var(--gold-light);
  background: var(--card-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.22s, color 0.22s;
}
.btn:hover, .btn:active {
  background: rgba(212,168,67,0.85);
  color: var(--purple-dark);
}
.btn-primary {
  background: rgba(212,168,67,0.18);
  border-color: var(--gold);
}

/* ── CHIUSURA ── */
.closing {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(1.8rem, 7.5vw, 2.6rem);
  color: var(--gold-light);
  text-align: center;
  line-height: 1.4;
  text-shadow: 0 1px 10px rgba(0,0,0,0.8);
}
</style>
</head>
