<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erika & Elisabetta ♡ 4 Settembre 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  min-height:100%;
  font-family:'Lato',sans-serif;
  background:#000;
  overflow-x:hidden;
}

/* WRAPPER */
#page{
  position:relative;
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  overflow:hidden;
}

/* SFONDO FIX (GitHub safe) */
#bgImg{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:100%;
  object-fit:cover;
  z-index:-1;
}

/* CONTENUTO */
#content{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
  padding:8% 5% 50px;
}

/* SEZIONI */
.section{
  width:100%;
  max-width:420px;
}

/* TESTO */
.text-outline{
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

.names{
  font-family:'Great Vibes',cursive;
  font-size:clamp(3rem,12vw,5rem);
  text-align:center;
  color:#fff;
}

.amp{
  display:block;
  color:#ffd700;
  font-size:clamp(2rem,7vw,3rem);
}

/* LABEL */
.label{
  display:block;
  text-align:center;
  color:#ffd700;
  letter-spacing:0.2em;
  text-transform:uppercase;
  font-size:0.85rem;
  margin-bottom:14px;
  font-weight:700;
}

/* BOX GLASS (fix GitHub rendering) */
.glass{
  width:100%;
  padding:18px;
  border-radius:14px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,215,0,0.25);
  backdrop-filter:blur(6px);
}

/* CARD TEXT */
.card p{
  color:#fff;
  text-align:center;
  font-size:1.05rem;
  line-height:1.6;
  font-style:italic;
}

.card strong{
  color:#ffd700;
}

/* TIMELINE */
.timeline{
  display:flex;
  flex-direction:column;
}

.row{
  display:flex;
  align-items:flex-start;
}

.left{
  width:24%;
  text-align:right;
  padding-right:12px;
}

.time{
  color:#ffd700;
  font-weight:700;
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ffd700;
}

.line{
  width:2px;
  min-height:30px;
  background:linear-gradient(to bottom,#ffd700,transparent);
}

.row:last-child .line{
  display:none;
}

.right{
  flex:1;
  padding-left:12px;
  padding-bottom:18px;
}

.event{
  color:#fff;
  font-weight:700;
}

.desc{
  color:#eee;
  font-style:italic;
  font-size:0.9rem;
}

/* BOTTONI */
.btn{
  display:block;
  width:100%;
  text-align:center;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,215,0,0.5);
}

.btn:hover{
  background:rgba(255,255,255,0.18);
}

/* MAPPA FIX (no SVG glitch GitHub) */
.map{
  width:100%;
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(255,215,0,0.3);
}

.map img{
  width:100%;
  display:block;
}

</style>
</head>

<body>

<div id="page">

  <img id="bgImg" src="https://i.imgur.com/RcXItON.jpeg">

  <div id="content">

    <!-- NOMI -->
    <div class="section">
      <div class="names text-outline">
        Erika <span class="amp">&</span> Elisabetta
      </div>
    </div>

    <!-- INTRO -->
    <div class="section glass">
      <div class="card">
        <p class="text-outline">
          ✨ Dopo 5 anni,<br>
          <strong>finalmente ci sposiamo! 🏰</strong>
        </p>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="section glass">
      <span class="label text-outline">La giornata</span>

      <div class="timeline">

        <div class="row">
          <div class="left"><div class="time">16:00</div></div>
          <div class="center"><div class="dot"></div><div class="line"></div></div>
          <div class="right"><div class="event">Arrivo ospiti</div><div class="desc">Parco Gambrinus</div></div>
        </div>

        <div class="row">
          <div class="left"><div class="time">17:00</div></div>
          <div class="center"><div class="dot"></div><div class="line"></div></div>
          <div class="right"><div class="event">Cerimonia</div><div class="desc">Il momento</div></div>
        </div>

        <div class="row">
          <div class="left"><div class="time">18:30</div></div>
          <div class="center"><div class="dot"></div><div class="line"></div></div>
          <div class="right"><div class="event">Aperitivo</div><div class="desc">Brindisi</div></div>
        </div>

        <div class="row">
          <div class="left"><div class="time">20:00</div></div>
          <div class="center"><div class="dot"></div><div class="line"></div></div>
          <div class="right"><div class="event">Cena</div><div class="desc">Sotto le stelle</div></div>
        </div>

        <div class="row">
          <div class="left"><div class="time">23:00</div></div>
          <div class="center"><div class="dot"></div><div class="line"></div></div>
          <div class="right"><div class="event">Torta</div><div class="desc">Party 🎉</div></div>
        </div>

      </div>
    </div>

    <!-- MAPPA -->
    <div class="section glass">
      <span class="label">Come arrivare</span>

      <div class="map">
        <img src="https://maps.googleapis.com/maps/api/staticmap?center=Parco+Gambrinus+San+Polo+di+Piave&zoom=14&size=800x400&markers=color:gold%7CParco+Gambrinus">
      </div>

      <a class="btn" href="https://maps.google.com/?q=Parco+Gambrinus">
        Apri in Maps
      </a>
    </div>

    <!-- CHIUSURA -->
    <div class="section">
      <p class="text-outline" style="text-align:center; color:#fff; font-size:1.8rem; font-family:'Great Vibes',cursive;">
        Non vediamo l’ora ✨
      </p>
    </div>

    <!-- CONTATTI -->
    <div class="section glass">

      <a class="btn" href="https://wa.me/393429435775">WhatsApp</a>
      <a class="btn" href="tel:+393429435775">Chiamaci</a>

    </div>

  </div>

</div>

</body>
</html>
